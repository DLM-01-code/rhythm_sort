<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Выбор папки с музыкой</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1d24;
      color: #e5e7eb;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      overflow: hidden; /* запрещаем глобальный скролл */
    }

    /* Toolbar - фиксированный */
    .toolbar {
      padding: 12px 16px;
      background: #252932;
      border-bottom: 1px solid #374151;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-shrink: 0; /* не сжимается */
      flex-wrap: wrap; /* кнопки переносятся при узком окне */
    }

    .path-bar {
      flex: 1;
      min-width: 150px; /* минимальная ширина */
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      font-family: monospace;
      color: #9ca3af;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    button {
      padding: 8px 16px;
      background: #3b82f6;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
      flex-shrink: 0;
      white-space: nowrap;
    }

    button:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }

    button.secondary {
      background: #374151;
    }

    button.secondary:hover {
      background: #4b5563;
    }

    button.danger {
      background: #dc2626;
    }

    button.danger:hover {
      background: #b91c1c;
    }

    /* Stats - фиксированный */
    .stats {
      padding: 8px 16px;
      background: #1f2937;
      border-bottom: 1px solid #374151;
      font-size: 12px;
      color: #9ca3af;
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Content - скроллится */
    .content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px;
      min-height: 0; /* важно для flex */
    }

    /* Grid для файлов - адаптивный! */
    .files-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 8px;
      width: 100%;
    }

    /* Items */
    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.15s;
      min-width: 0; /* важно для truncate */
      background: #1f2937;
    }

    .item:hover {
      background: #374151;
    }

    .item.selected {
      background: #3b82f6;
      color: white;
    }

    .icon {
      font-size: 20px;
      width: 32px;
      text-align: center;
      flex-shrink: 0;
    }

    .name {
      flex: 1;
      font-size: 14px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .info {
      font-size: 11px;
      color: #6b7280;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .item.selected .info {
      color: rgba(255,255,255,0.7);
    }

    /* Для корневого элемента ".." */
    .parent-item {
      background: #252932;
      border: 1px dashed #374151;
    }

    .parent-item:hover {
      background: #374151;
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #6b7280;
    }

    .empty .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    /* Footer - фиксированный */
    .footer {
      padding: 16px;
      border-top: 1px solid #374151;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      background: #252932;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1f2937;
    }

    ::-webkit-scrollbar-thumb {
      background: #4b5563;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #6b7280;
    }

    /* Медиа-запрос для очень узких окон */
    @media (max-width: 500px) {
      .toolbar {
        padding: 8px;
        gap: 6px;
      }
      
      button {
        padding: 6px 10px;
        font-size: 11px;
      }
      
      .path-bar {
        font-size: 10px;
        padding: 6px 8px;
        min-width: 100px;
      }
      
      .files-grid {
        grid-template-columns: 1fr; /* одна колонка на телефоне */
      }
      
      .item {
        padding: 6px 10px;
      }
      
      .icon {
        font-size: 16px;
        width: 24px;
      }
      
      .name {
        font-size: 12px;
      }
      
      .info {
        font-size: 9px;
      }
    }

    /* Для очень высоких/низких окон */
    @media (max-height: 400px) {
      .stats {
        padding: 4px 12px;
      }
      
      .footer {
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="path-bar" id="pathDisplay">/</div>
    <button id="upBtn" class="secondary">⬆ Наверх</button>
    <button id="homeBtn" class="secondary">🏠 Домой</button>
  </div>
  
  <div class="stats" id="stats">
    <span>📁 Загрузка...</span>
    <span>🎵 -</span>
  </div>
  
  <div class="content" id="content">
    <div class="empty">
      <div class="icon">📂</div>
      <div>Выберите папку с музыкой</div>
    </div>
  </div>
  
  <div class="footer">
    <button id="cancelBtn" class="secondary">Отмена</button>
    <button id="selectBtn">✅ Выбрать эту папку</button>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    
    let currentPath = '';
    let items = [];
    let selectedPath = '';
    let audioFilesCount = 0;
    
    const AUDIO_EXTS = new Set([
      "mp3", "wav", "flac", "aac", "ogg", "m4a", "m4b", "m4r", "m4p",
      "mp4", "mpeg", "mpga", "mp2", "mpa", "opus", "wma", "wmv", "aiff", 
      "aif", "aifc", "caf", "alac", "ape", "dsf", "dff", "dvf", "gsm", 
      "ircam", "m3u", "mka", "mlp", "ra", "rm", "snd", "tak", "tta", "voc", 
      "vox", "wv", "3gp", "amr", "awb", "dct", "dss", "dvms", "m4v", "mkv", 
      "mov", "mpv", "oga", "ogv", "ogx", "spx", "webm"
    ]);
    
    function pathParse(p) {
      const sep = p.includes('\\') ? '\\' : '/';
      const parts = p.split(sep);
      const fileName = parts[parts.length - 1];
      const dir = parts.slice(0, -1).join(sep);
      const root = sep === '\\' ? (parts[0] + '\\') : '/';
      return { dir, root, base: fileName };
    }
    
    function formatSize(bytes) {
      if (!bytes) return '';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    async function loadDirectory(dirPath) {
      if (!dirPath) return;
      
      currentPath = dirPath;
      document.getElementById('pathDisplay').textContent = dirPath;
      document.getElementById('pathDisplay').title = dirPath;
      
      try {
        const result = await ipcRenderer.invoke('folder-browser:scan', dirPath);
        if (result.success) {
          items = result.items;
          audioFilesCount = items.filter(i => !i.isDirectory && AUDIO_EXTS.has(i.extension)).length;
          renderItems();
          updateStats();
        } else {
          showError('Не удалось прочитать папку');
        }
      } catch (err) {
        showError('Ошибка: ' + err.message);
      }
    }
    
    function updateStats() {
      const foldersCount = items.filter(i => i.isDirectory).length;
      document.getElementById('stats').innerHTML = `
        <span>📁 Папок: ${foldersCount}</span>
        <span>🎵 Аудиофайлов: ${audioFilesCount}</span>
        <span>🔗 Ярлыков: ${items.filter(i => i.isShortcut).length}</span>
      `;
    }
    
    function renderItems() {
      const container = document.getElementById('content');
      
      if (items.length === 0 && currentPath) {
        container.innerHTML = '<div class="empty"><div class="icon">📁</div><div>Папка пуста</div></div>';
        return;
      }
      
      // Создаём grid контейнер
      const grid = document.createElement('div');
      grid.className = 'files-grid';
      
      // Добавляем ".." для навигации вверх (кроме корня)
      const isRoot = currentPath === pathParse(currentPath).root;
      if (!isRoot) {
        const parentDiv = createItemElement({
          name: '..',
          path: pathParse(currentPath).dir,
          isDirectory: true,
          isParent: true
        });
        parentDiv.classList.add('parent-item');
        grid.appendChild(parentDiv);
      }
      
      // Показываем все элементы
      for (const item of items) {
        const div = createItemElement(item);
        grid.appendChild(div);
      }
      
      container.innerHTML = '';
      container.appendChild(grid);
    }
    
    function createItemElement(item) {
      const div = document.createElement('div');
      div.className = 'item';
      if (selectedPath === item.path) {
        div.classList.add('selected');
      }
      
      const isAudio = !item.isDirectory && AUDIO_EXTS.has(item.extension);
      let icon = '📄';
      if (item.isDirectory && item.isShortcut) icon = '🔗📁';
      else if (item.isDirectory) icon = '📁';
      else if (isAudio) icon = '🎵';
      else if (item.name.toLowerCase().endsWith('.lnk')) icon = '🔗';
      
      let info = '';
      if (item.isDirectory && item.isShortcut) info = 'Ярлык';
      else if (item.isDirectory) info = 'Папка';
      else if (isAudio) info = formatSize(item.size);
      else if (item.name.toLowerCase().endsWith('.lnk')) info = 'Ярлык';
      
      div.innerHTML = `
        <div class="icon">${icon}</div>
        <div class="name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</div>
        <div class="info">${info}</div>
      `;
      
      if (item.isDirectory) {
        div.ondblclick = () => loadDirectory(item.path);
        div.onclick = (e) => {
          e.stopPropagation();
          selectedPath = item.path;
          renderItems();
        };
      } else if (isAudio) {
        div.style.opacity = '0.6';
        div.style.cursor = 'default';
        div.title = 'Аудиофайл (нельзя выбрать как папку)';
      } else {
        // Показываем другие файлы (включая ярлыки .lnk)
        div.style.opacity = '0.4';
        div.style.cursor = 'default';
        if (item.name.toLowerCase().endsWith('.lnk')) {
          div.title = 'Ярлык (будет разрешён при двойном клике)';
        } else {
          div.title = 'Не аудиофайл';
        }
      }
      
      return div;
    }
    
    function showError(msg) {
      const container = document.getElementById('content');
      container.innerHTML = `<div class="empty"><div class="icon">⚠️</div><div>${escapeHtml(msg)}</div></div>`;
    }
    
    // Обработчики кнопок
    document.getElementById('upBtn').onclick = () => {
      const parent = pathParse(currentPath).dir;
      if (parent && parent !== currentPath) {
        loadDirectory(parent);
      }
    };
    
    document.getElementById('homeBtn').onclick = () => {
      const home = process.env.USERPROFILE || process.env.HOME || 'C:\\';
      loadDirectory(home);
    };
    
    document.getElementById('selectBtn').onclick = () => {
      const folderToSelect = selectedPath || currentPath;
      if (audioFilesCount === 0) {
        const confirm = window.confirm('В этой папке нет аудиофайлов. Всё равно выбрать?');
        if (!confirm) return;
      }
      ipcRenderer.send('folder-browser:select', folderToSelect);
    };
    
    document.getElementById('cancelBtn').onclick = () => {
      ipcRenderer.send('folder-browser:cancel');
    };
    
    // Загружаем начальную папку
    window.onload = async () => {
      const startPath = process.env.USERPROFILE + '\\Music' || 
                       process.env.HOME + '/Music' || 
                       'C:\\';
      loadDirectory(startPath);
    };
  </script>
</body>
</html>
